<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Who Is My Computer Talking To?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>&gt; who_is_my_computer_talking_to<span class="cursor">_</span></h1>
    <p id="status">connecting...</p>
  </header>

  <main>
    <section>
      <h2>[ outgoing connections ]</h2>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>host</th><th>ip</th><th>port</th><th>packets</th></tr>
          </thead>
          <tbody id="connections"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2>[ dns lookups ]</h2>
      <div class="scroll">
        <table>
          <thead>
            <tr><th>time</th><th>domain</th></tr>
          </thead>
          <tbody id="dns"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
